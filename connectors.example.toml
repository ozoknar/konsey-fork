# Konsey connectors — hangi mesaj platformlarına bağlanacağınızı tanımlayın (opt-in).
# cp connectors.example.toml connectors.toml ; enabled=true yapın + auth_env'i set edin.
# Sağlayıcılar gibi: auth_env ortam değişkeni yoksa connector graceful "devre dışı" sayılır.

[connectors.telegram]
enabled = false
auth_env = "TELEGRAM_BOT_TOKEN"      # @BotFather'dan bot token; .env'e koyun
# allowed_chats = ["123456789"]      # opsiyonel: yalnız bu chat_id'lerden gelen mesaj işlenir

[connectors.notion]
enabled = false
auth_env = "NOTION_TOKEN"             # internal integration token; ayrıca NOTION_DATABASE_ID gerekir
# DB'deki her yeni sayfanın başlığı görev olur; sonuç sayfaya yorum olarak yazılır.

[connectors.slack]
enabled = false
auth_env = "SLACK_BOT_TOKEN"          # ayrıca SLACK_APP_TOKEN (Socket Mode). `pip install slack_sdk`
# Socket Mode → public URL gerekmez.

[connectors.whatsapp]
enabled = false
auth_env = "WHATSAPP_TOKEN"           # + WHATSAPP_PHONE_ID, WHATSAPP_VERIFY_TOKEN, WHATSAPP_APP_SECRET
# Meta Cloud API webhook → public HTTPS URL'i Meta'ya kaydedin.
# POST'lar X-Hub-Signature-256 (HMAC) ile doğrulanır → imzasız istek 403 (fail-closed).
