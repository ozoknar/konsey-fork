# Konsey sağlayıcıları — HANGİ YZ ÜRÜNLERİNİ kullanıyorsanız burada tanımlayın.
# `cp konsey.providers.example.toml konsey.providers.toml` ve düzenleyin.
# Dosya yoksa yerleşik varsayılanlar (claude + codex + google) kullanılır.
#
# Komut şablonu yer tutucuları:  {prompt}  {timeout}
# role: architect (lead) | critic | researcher | juror
# auth: çoğu CLI kendi OAuth/aboneliğiyle girer. API-key gerekiyorsa auth_env ver
#       → o ortam değişkeni yoksa sağlayıcı "kullanılamaz" sayılır (graceful).

[providers.claude]
enabled = true
role = "architect"
provider = "anthropic"
command = ["claude", "-p", "{prompt}"]
prompt_prefix = "Answer directly in plain text. Do not use any tools.\n\n"
# auth_env = "ANTHROPIC_API_KEY"   # CLI OAuth kullanıyorsa gerekmez

[providers.codex]
enabled = true
role = "critic"
provider = "openai"
command = ["codex", "exec", "--skip-git-repo-check", "{prompt}"]

[providers.gemini]
enabled = true
role = "researcher"
provider = "google"
command = ["agy", "--print-timeout", "{timeout}s", "-p", "{prompt}"]

# --- Yerel model (Ollama) — veri CİHAZDAN ÇIKMAZ; PHI/gizli/çevrimdışı işler için ideal ---
# Kurulum: https://ollama.com → `ollama pull llama3.1`. Aktif etmek için enabled=true.
[providers.ollama]
enabled = false
role = "architect"
provider = "local"
command = ["ollama", "run", "llama3.1", "{prompt}"]

