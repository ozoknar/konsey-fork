# Council — example local profile (FICTIONAL "Acme Labs"; NOT derived from any real
# deployment). Copy to `council.local.toml` and edit for your machine.
#
# This file holds ONLY declarative facts — NEVER secrets. API keys / tokens live in your
# OS keychain or secret manager, never in this file or the repo (Constitution Art. 2.4).
# `council.local.toml` is git-ignored; this `*.example.toml` is the tracked template.

owner  = "operator"          # a label, NOT your machine username — never leaked to the audit log
org    = "Acme Labs"
locale = "en"                # en | tr
data_regime  = "standard"    # standard | kvkk | gdpr | hipaa  (regulated → regimes/<name>.toml)
exec_sandbox = "off"         # off | read-only | workspace-write
autocapture_enabled = false  # opt-in background distillation; default OFF
parallel_plan = false        # opt-in: run the PLAN providers concurrently; default OFF
parallel_plan_rank = false   # opt-in: anonymized cross-ranking of PLAN candidates when
                             #   parallel_plan produced >1; default OFF. Advisory/REPORT
                             #   only — wiring it into decide.py's score was proposed and
                             #   explicitly CANCELLED by the owner (2026-07-11); permanent.
parallel_verify = false      # opt-in: fan VERIFY out to every non-executor agent (not just
                             #   one); default OFF. A split PASS/FAIL verdict is NOT
                             #   majority-resolved — it escalates to a human (Art. 7).
verify_cmd = ""              # opt-in: a real acceptance command at VERIFY (e.g. "pytest -q");
                             #   its exit code is authoritative over the LLM verdict
                             #   (gate-test != real-test). Empty = LLM-only verify.
learn_from_repo = false      # opt-in: read the target repo's own lessons file (whichever
                             #   convention it already uses — .prometheus/LESSONS.md /
                             #   LESSONS.md / KONSEY_LESSONS.md / lrn/) into PLAN, and
                             #   append a new dated entry when a run escalates to a
                             #   human (Art. 7) — a routine autonomous run writes nothing.

# Roster: a generic role → a provider CLI on PATH. Cross-verification needs >= 2 providers
# so the producer of a result is never its sole verifier (Art. 2.4); a single provider runs
# in advisory mode (capped confidence). Swap a provider by changing `cli` — never the code.
[[agents]]
name = "claude"
cli  = "claude"
role = "lead"

[[agents]]
name = "codex"
cli  = "codex"
role = "critic"              # a different provider than the lead → it can cross-verify

# Project risk registry: a project name alone never implies sensitivity — risk is what YOU
# declare here (Art. 4.4). The glob matches the `--project` hint; the highest match wins and
# can only RAISE the floor, never lower it.
[[projects]]
match = "infra/*"
risk  = "production"         # public | internal | pii | sensitive | production
