name: secret-scan
on:
  push:
  pull_request:
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # NOTE: gitleaks catches token/secret FORMATS, NOT org/product/person NAMES.
      # Name-leak prevention relies on human review + the allow-list .gitignore.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
