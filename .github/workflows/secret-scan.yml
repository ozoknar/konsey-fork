name: secret-scan
on:
  push:
  pull_request:
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # NOTE: gitleaks catches token/secret FORMATS, NOT org/product/person NAMES.
      # Name-leak prevention relies on human review + the allow-list .gitignore.
      # Run the binary directly (full-repo `detect`) rather than the action's push-range
      # mode: the latter fails on a brand-new repo's first push (invalid `before..after`
      # range). This scans the whole history and honors .gitleaks.toml (fixture allowlist).
      - name: Install gitleaks
        run: |
          VER=8.24.3
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan full repo for secrets
        run: gitleaks detect --source . --config .gitleaks.toml --redact -v --exit-code 1
