name: ci
on:
  push:
    branches: [main, master]   # repo default is master; also fire if renamed to main
  pull_request:
jobs:
  test:
    # Python 3.12 only — 3.10/3.11 are unproven and intentionally not claimed.
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check council tests
      - run: mypy council
      - run: pytest -q

  # POSIX-sh hygiene for the installer (S3): shellcheck is pre-installed on the
  # ubuntu runner; -s sh forces the POSIX dialect so any bash-ism is flagged.
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck install.sh (POSIX sh dialect)
        run: shellcheck -s sh install.sh
