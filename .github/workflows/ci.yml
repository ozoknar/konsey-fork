name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    # Python 3.12 only — 3.10/3.11 are unproven and intentionally not claimed.
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check council tests
      - run: mypy council
      - run: pytest -q
