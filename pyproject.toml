[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "konsey"
version = "0.1.0"
description = "Çok-ajanlı, kanıt-ağırlıklı orkestrasyon düzeni (Claude + Codex + Google)."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "langgraph>=0.2",
    "duckdb>=1.0",
]

[tool.setuptools]
packages = ["orchestrator", "connectors"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
connectors = [
    "slack_sdk>=3.0",   # yalnız Slack connector için (opsiyonel)
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"bin/konsey_db.py" = ["E702"]        # argparse kurulumunda kompakt ; stili (kasıtlı)
"connectors/whatsapp.py" = ["E702"]  # http.server yanıt satırları (kompakt ; kasıtlı)
"tests/*" = ["E402"]                 # test modülleri dinamik import-yükleme yapar

[tool.pytest.ini_options]
testpaths = ["tests"]
