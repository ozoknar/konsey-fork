[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "konsey-cli"
dynamic = ["version"]              # single-sourced from council/__init__.py (see [tool.hatch.version])
description = "Multi-agent, evidence-weighted, vendor-independent work doctrine and terminal orchestrator."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["llm", "orchestration", "multi-agent", "audit", "evidence-weighted", "cli"]
authors = [{ name = "Council contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "langgraph==1.2.2",
    "langchain-core==1.4.0",
    "duckdb==1.5.3",
    "pydantic==2.13.4",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "mypy",
    "build",
    "twine",          # `twine check` validates release metadata (S5; no upload)
]

[project.scripts]
konsey = "council.cli:main"    # canonical command (S0: konsey is now the primary name)
council = "council.cli:main"   # deprecated alias — kept fully working; prints a one-line notice on a TTY

[project.urls]
Homepage = "https://github.com/eMediquality/konsey"
Repository = "https://github.com/eMediquality/konsey"
Changelog = "https://github.com/eMediquality/konsey/blob/master/CHANGELOG.md"
Issues = "https://github.com/eMediquality/konsey/issues"

# Single-source the version from council/__init__.py (__version__); bump there only.
[tool.hatch.version]
path = "council/__init__.py"

# SECURITY (S5): an explicit sdist ALLOWLIST. Building from a working tree would
# otherwise pull gitignored machine/doctrine files into the tarball — verified: a plain
# `python -m build` shipped council.local.toml (a machine profile) and
# constitution/KONSEY_ANAYASASI.md (the live doctrine draft). Listing `include` makes the
# sdist a closed set; `exclude` is belt-and-suspenders. Only constitution/README.md (the
# CC-BY summary) ships — never the draft (Constitution Art. 2/13: no machine-facts shipped).
[tool.hatch.build.targets.sdist]
include = [
    "/council",
    "/regimes",
    "/constitution/README.md",
    "/examples",
    "/README.md", "/README.tr.md",
    "/LICENSE", "/NOTICE",
    "/CHANGELOG.md", "/KNOWN_ISSUES.md", "/SECURITY.md", "/CONTRIBUTING.md",
    "/install.sh",
    "/requirements.txt", "/requirements-dev.txt",
    "/pyproject.toml",
]
exclude = [
    "constitution/KONSEY_ANAYASASI.md",   # live doctrine working draft — never ship
    "council.local.toml", "council.local.*",
    ".gitleaks.toml",
    "tests", ".github",
    "**/__pycache__",
]

[tool.hatch.build.targets.wheel]
packages = ["council"]

# Only paths OUTSIDE the `council` package need force-include; files under
# `council/` (locales/*.json, db/schema.sql) are already shipped by packages=["council"]
# above — listing them again duplicated every locale in the wheel (Codex finding #4).
[tool.hatch.build.targets.wheel.force-include]
"regimes" = "regimes"                   # starter regulatory-regime packs (gdpr/hipaa/kvkk/lgpd/ccpa/pipl/pdpa)

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
